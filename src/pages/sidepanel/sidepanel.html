<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrowseKit side panel</title>
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
    <link rel="stylesheet" href="../popup/popup.css" />
    <script type="module" src="../popup/popup.js"></script>
  </head>
  <body data-mode="sidepanel">
    <header class="popup-header">
      <img src="../../../assets/icons/icon32.png" alt="" width="22" height="22" />
      <h1>BrowseKit</h1>
      <button id="open-sidepanel" class="icon-btn" type="button" title="Open in side panel" aria-label="Open in side panel" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm10 2v12h5V6h-5z"/></svg>
      </button>
      <button id="open-dashboard" class="btn btn--sm" type="button">Dashboard</button>
    </header>
    <div class="popup-search">
      <input id="search" class="input search-all" type="search" placeholder="Search everything…  ( / )" aria-label="Search tabs, TabVault, Watch Later, sessions and actions" autocomplete="off" spellcheck="false" />
    </div>
    <div id="search-results" class="palette palette--embedded"></div>
    <div id="banner"></div>
    <div class="page-card" id="page-card" aria-live="polite"></div>
    <div class="tabs tabs--popup" id="panel-tabs" role="tablist" aria-label="BrowseKit tools">
      <button class="tabs__tab" type="button" role="tab" id="tab-save" aria-controls="panel" data-panel="save">Save</button>
      <button class="tabs__tab" type="button" role="tab" id="tab-media" aria-controls="panel" data-panel="media">Media</button>
      <button class="tabs__tab" type="button" role="tab" id="tab-tabs" aria-controls="panel" data-panel="tabs">Tabs</button>
      <button class="tabs__tab" type="button" role="tab" id="tab-tools" aria-controls="panel" data-panel="tools">Tools</button>
    </div>
    <main id="panel" class="panel" role="tabpanel"></main>
    <footer class="popup-footer muted">Local only · nothing leaves this device</footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>

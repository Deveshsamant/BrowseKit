<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrowseKit</title>
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="popup-header">
      <img src="../../../assets/icons/icon32.png" alt="" width="22" height="22" />
      <h1>BrowseKit</h1>
      <button id="open-dashboard" class="btn btn--primary" type="button">Dashboard</button>
    </header>
    <main>
      <ul id="sections" class="section-list" aria-label="Sections"></ul>
    </main>
    <footer class="popup-footer muted">All data stays on this device.</footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>

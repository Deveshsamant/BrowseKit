<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrowseKit</title>
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/components.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="popup-header">
      <img src="../../../assets/icons/icon32.png" alt="" width="22" height="22" />
      <h1>BrowseKit</h1>
      <button id="open-dashboard" class="btn btn--sm" type="button">Dashboard</button>
    </header>
    <div class="page-card" id="page-card" aria-live="polite"></div>
    <div class="tabs tabs--popup" role="tablist" aria-label="BrowseKit tools">
      <button class="tabs__tab" type="button" role="tab" id="tab-save" aria-controls="panel" data-panel="save">Save</button>
      <button class="tabs__tab" type="button" role="tab" id="tab-media" aria-controls="panel" data-panel="media">Media</button>
      <button class="tabs__tab" type="button" role="tab" id="tab-tabs" aria-controls="panel" data-panel="tabs">Tabs</button>
      <button class="tabs__tab" type="button" role="tab" id="tab-tools" aria-controls="panel" data-panel="tools">Tools</button>
    </div>
    <main id="panel" class="panel" role="tabpanel"></main>
    <footer class="popup-footer muted">Local only · nothing leaves this device</footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
